<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Tracker workflow</title>
  <desc id="desc">Source papers and atomic claims pass through paper identity checks, full-text passage retrieval and claim review. The audit report records pages, passages, reasons and evidence states, including retrieval blockers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#71869a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="900" height="600" rx="20" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#263e52">
    <rect x="24" y="44" width="188" height="512" rx="18" fill="#f7f9fb" stroke="#d9e1e7" stroke-width="2"/>
    <text x="118" y="91" font-size="27" font-weight="700">Inputs</text>
    <g stroke="#6d8ca6" stroke-width="3" stroke-linejoin="round">
      <rect x="83" y="132" width="76" height="91" rx="7" fill="#e7eff6"/>
      <rect x="73" y="142" width="76" height="91" rx="7" fill="#fff"/>
      <path d="M88 165h45M88 181h45M88 197h34M88 213h39" stroke-linecap="round"/>
    </g>
    <text x="118" y="272" font-size="24" font-weight="700">Source PDFs</text>
    <g stroke="#8b9b91" stroke-width="3" stroke-linecap="round">
      <rect x="64" y="333" width="108" height="78" rx="12" fill="#eaf2ec"/>
      <path d="M83 355h69M83 373h56M83 391h64"/>
    </g>
    <text x="118" y="454" font-size="24" font-weight="700">Atomic claims</text>
    <path d="M220 300h27" stroke="#71869a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="260" y="44" width="336" height="512" rx="18" fill="#fff" stroke="#91aec5" stroke-width="2.5"/>
    <text x="428" y="91" font-size="28" font-weight="700">Evidence Tracker</text>
    <rect x="280" y="123" width="296" height="105" rx="12" fill="#eaf2f9" stroke="#b8cddb" stroke-width="2"/>
    <text x="428" y="166" font-size="26" font-weight="700">Check identity</text>
    <text x="428" y="201" font-size="21" fill="#5b6b79">Title · DOI · arXiv</text>
    <path d="M428 234v31" stroke="#71869a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="280" y="277" width="296" height="105" rx="12" fill="#edf5ee" stroke="#bed4c3" stroke-width="2"/>
    <text x="428" y="320" font-size="26" font-weight="700">Retrieve passages</text>
    <text x="428" y="355" font-size="21" fill="#5b6b79">Full text · Page references</text>
    <path d="M428 388v31" stroke="#71869a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="280" y="431" width="296" height="105" rx="12" fill="#fbf5e6" stroke="#dfd0a9" stroke-width="2"/>
    <text x="428" y="474" font-size="26" font-weight="700">Review support</text>
    <text x="428" y="509" font-size="21" fill="#5b6b79">LLM + deterministic rules</text>
    <path d="M604 300h27" stroke="#71869a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="644" y="44" width="232" height="512" rx="18" fill="#f7f9fb" stroke="#d9e1e7" stroke-width="2"/>
    <text x="760" y="91" font-size="27" font-weight="700">Audit report</text>
    <rect x="690" y="130" width="140" height="160" rx="8" fill="#fff" stroke="#9bacb9" stroke-width="2.5"/>
    <path d="M711 156h97M711 178h97M711 200h76M711 222h97M711 244h62" fill="none" stroke="#b7c8d5" stroke-width="6" stroke-linecap="round"/>
    <text x="760" y="329" font-size="23" font-weight="700">Pages · Passages</text>
    <text x="760" y="360" font-size="23" font-weight="700">Reasons</text>
    <g font-size="17" font-weight="700">
      <rect x="660" y="393" width="94" height="38" rx="9" fill="#e8f1ea" stroke="#a9c9b2"/><text x="707" y="418" fill="#426d4f">GREEN</text>
      <rect x="766" y="393" width="94" height="38" rx="9" fill="#fbf3df" stroke="#dcc995"/><text x="813" y="418" fill="#846821">YELLOW</text>
      <rect x="660" y="444" width="94" height="38" rx="9" fill="#f9eae8" stroke="#dbb0aa"/><text x="707" y="469" fill="#9a544c">RED</text>
      <rect x="766" y="444" width="94" height="38" rx="9" fill="#edf0f3" stroke="#bbc5d0"/><text x="813" y="469" fill="#566777">BLOCKED</text>
    </g>
    <text x="760" y="520" font-size="18" fill="#5b6b79">Failures stay visible</text>
  </g>
</svg>
